# ========================
# DATABASE CONFIGURATION
# ========================
spring.datasource.url=jdbc:postgresql://192.168.18.210:5432/ticketing
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================
# JPA / HIBERNATE
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# ========================
# SERVER
# ========================
server.port=8082

# ========================
# JWT CONFIGURATION
# ========================
# Base64-encoded 256-bit secret key for signing JWT tokens
jwt.secret=dGlja2V0aW5nLWl0c20tYjJiLXNlY3JldC1rZXktMjAyNi1zcHJpbmctYm9vdC1iYWNrZW5k
# Token expiration time in milliseconds (2 hours = 7200000)
jwt.expiration=7200000

# ========================
# FILE UPLOAD
# ========================
file.upload-dir=./uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=10MB

# ========================
# SECURITY CONFIGURATION
# ========================
# CORS allowed origins (comma-separated)
security.cors.allowed-origins=http://localhost:3000,http://192.168.20.187:5173,http://localhost:5173,http://192.168.20.166:5173,http://192.168.20.144:5173,http://192.168.20.167:5173,http://192.168.20.189:5173

# Actuator - expose only health endpoint (NIST CM-7: Least Functionality)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Hide Spring Boot version in error pages
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Disable server header disclosure (CWE-200)
server.server-header=

# ========================
# MAIL / SMTP CONFIGURATION
# ========================
spring.mail.host=mail.mwahyu.my.id
spring.mail.port= 465
spring.mail.username=admin@mwahyu.my.id
spring.mail.password=******
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
mail.from.address=admin@mwahyu.my.id
mail.from.name=ITSM Ticketing System

# ========================
# THYMELEAF CONFIGURATION
# ========================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
