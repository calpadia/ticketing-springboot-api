# ========================
# DATABASE CONFIGURATION
# ========================
spring.datasource.url=jdbc:postgresql://192.168.18.210:5432/ticketing
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================
# JPA / HIBERNATE
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# ========================
# SERVER
# ========================
server.port=808:2

# ========================
# JWT CONFIGURATION
# ========================
# Base64-encoded 256-bit secret key for signing JWT tokens
jwt.secret=dGlja2V0aW5nLWl0c20tYjJiLXNlY3JldC1rZXktMjAyNi1zcHJpbmctYm9vdC1iYWNrZW5k
# Token expiration time in milliseconds (2 hours = 7200000)
jwt.expiration=7200000

# ========================
# FILE UPLOAD
# ========================
file.upload-dir=./uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
